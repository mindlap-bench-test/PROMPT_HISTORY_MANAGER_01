<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt History Manager - Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .search-section {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1em;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .sort-select {
      padding: 12px 16px;
      font-size: 1em;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .sort-select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      transform: scale(0.98);
    }

    .seed-button {
      background: #4caf50;
      margin-top: 20px;
      width: 100%;
    }

    .seed-button:hover {
      background: #45a049;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 150px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8em;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }

    .results-section {
      margin-top: 20px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e0e0e0;
    }

    .result-count {
      color: #666;
      font-size: 0.95em;
    }

    .prompts-grid {
      display: grid;
      gap: 15px;
    }

    .prompt-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      border-left: 4px solid #667eea;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .prompt-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
      gap: 10px;
    }

    .prompt-metadata {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      background: #e3f2fd;
      color: #1976d2;
    }

    .badge.platform {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .badge.model {
      background: #e8f5e9;
      color: #388e3c;
    }

    .timestamp {
      font-size: 0.85em;
      color: #999;
      white-space: nowrap;
    }

    .prompt-text {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #333;
      font-weight: 600;
    }

    .response-text {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #666;
      font-size: 0.95em;
      background: #fafafa;
      padding: 12px;
      border-radius: 4px;
      border-left: 3px solid #ddd;
    }

    .text-preview {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .no-results-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #c62828;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #4caf50;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      .search-box {
        flex-direction: column;
      }

      .prompt-card {
        padding: 15px;
      }

      .prompts-grid {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function Dashboard() {
      const [prompts, setPrompts] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('date');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [hasSearched, setHasSearched] = useState(false);

      useEffect(() => {
        loadAllPrompts();
      }, []);

      const loadAllPrompts = async () => {
        setLoading(true);
        setError('');
        try {
          const response = await fetch(`/api/prompts?sort=${sortBy}`);
          const data = await response.json();
          if (data.success) {
            setPrompts(data.prompts);
            setHasSearched(false);
          } else {
            setError('Failed to load prompts');
          }
        } catch (err) {
          setError(`Error: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        if (searchQuery.trim() === '') {
          loadAllPrompts();
          return;
        }

        setLoading(true);
        setError('');
        setHasSearched(true);

        try {
          const response = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}&sort=${sortBy}`);
          const data = await response.json();
          if (data.success) {
            setPrompts(data.results);
          } else {
            setError('Search failed');
          }
        } catch (err) {
          setError(`Error: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const handleSortChange = async (e) => {
        const newSort = e.target.value;
        setSortBy(newSort);
        setLoading(true);
        setError('');

        try {
          if (searchQuery.trim() === '') {
            const response = await fetch(`/api/prompts?sort=${newSort}`);
            const data = await response.json();
            if (data.success) {
              setPrompts(data.prompts);
            }
          } else {
            const response = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}&sort=${newSort}`);
            const data = await response.json();
            if (data.success) {
              setPrompts(data.results);
            }
          }
        } catch (err) {
          setError(`Error: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const handleSeed = async () => {
        setLoading(true);
        setError('');
        setSuccess('');

        try {
          const response = await fetch('/api/seed', { method: 'POST' });
          const data = await response.json();
          if (data.success) {
            setSuccess(data.message);
            await loadAllPrompts();
          } else {
            setError(data.message || 'Failed to seed database');
          }
        } catch (err) {
          setError(`Error: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const formatDate = (timestamp) => {
        if (!timestamp) return 'Unknown';
        const date = new Date(timestamp * 1000);
        return date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      };

      return (
        <div className="container">
          <header>
            <h1>📝 Prompt History Manager</h1>
            <p className="subtitle">Search and retrieve your stored prompts</p>
          </header>

          <div className="search-section">
            {error && <div className="error">{error}</div>}
            {success && <div className="success">{success}</div>}

            <div className="stats">
              <div className="stat">
                <div className="stat-value">{prompts.length}</div>
                <div className="stat-label">{hasSearched ? 'Results' : 'Total Prompts'}</div>
              </div>
            </div>

            <form onSubmit={handleSearch}>
              <div className="search-box">
                <input
                  type="text"
                  placeholder="Search prompts and responses by keyword..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
                <select className="sort-select" value={sortBy} onChange={handleSortChange}>
                  <option value="date">Newest First</option>
                  <option value="date-asc">Oldest First</option>
                </select>
                <button type="submit">Search</button>
              </div>
            </form>

            <button className="seed-button" onClick={handleSeed} disabled={loading}>
              {loading ? 'Loading...' : 'Load Sample Data'}
            </button>

            {loading && (
              <div className="loading">
                <div className="spinner"></div>
              </div>
            )}
          </div>

          {!loading && (
            <div className="search-section">
              {prompts.length === 0 ? (
                <div className="no-results">
                  <div className="no-results-icon">🔍</div>
                  <p>{hasSearched ? 'No prompts found matching your search.' : 'No prompts stored yet. Click "Load Sample Data" to get started.'}</p>
                </div>
              ) : (
                <div className="results-section">
                  <div className="result-header">
                    <h2>Results</h2>
                    <span className="result-count">{prompts.length} prompt{prompts.length !== 1 ? 's' : ''} found</span>
                  </div>

                  <div className="prompts-grid">
                    {prompts.map((prompt) => (
                      <div key={prompt.id} className="prompt-card">
                        <div className="prompt-header">
                          <div className="prompt-metadata">
                            <span className="badge platform">{prompt.platform || 'Unknown'}</span>
                            <span className="badge model">{prompt.model || 'N/A'}</span>
                          </div>
                          <span className="timestamp">{formatDate(prompt.timestamp)}</span>
                        </div>

                        <div className="prompt-text text-preview">
                          {prompt.promptText}
                        </div>

                        {prompt.responseText && (
                          <div className="response-text text-preview">
                            {prompt.responseText}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>
</html>
